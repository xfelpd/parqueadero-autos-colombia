<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autos Colombia – Entradas y salidas</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1f2933}
  header{background:#0b3d91;color:#fff;padding:14px 24px;font-size:20px}
  main{max-width:900px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
  section{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px #0002}
  input,select,button{padding:8px;font-size:15px;margin:4px 4px 4px 0}
  button{background:#0b3d91;color:#fff;border:0;border-radius:6px;cursor:pointer}
  button.sec{background:#c0392b}
  table{width:100%;border-collapse:collapse} td,th{padding:6px;border-bottom:1px solid #e4e7eb;text-align:left}
  #msg{padding:8px;border-radius:6px;display:none} .ok{background:#d4edda}.err{background:#f8d7da}
  .celdas{display:flex;flex-wrap:wrap;gap:8px}
  .celda{width:64px;padding:10px 0;text-align:center;border-radius:6px;color:#fff;font-weight:600}
  .libre{background:#2e9e5b}.ocupada{background:#c0392b}.mantenimiento{background:#888}
</style>
</head>
<body>
<header>Autos Colombia · Control de acceso</header>
<main>
  <div id="msg"></div>
  <section id="login">
    <h3>Iniciar sesión</h3>
    <input id="usuario" placeholder="Usuario" value="operador">
    <input id="password" type="password" placeholder="Contraseña" value="1234">
    <button onclick="login()">Ingresar</button>
  </section>
  <div id="panel" style="display:none;gap:16px;display:none">
    <section>
      <h3>Registrar entrada / salida</h3>
      <input id="placa" placeholder="Placa (ABC123)" maxlength="7" style="text-transform:uppercase">
      <button onclick="mover('entradas')">Registrar entrada</button>
      <button class="sec" onclick="mover('salidas')">Registrar salida</button>
    </section>
    <section>
      <h3>Registrar novedad</h3>
      <select id="tipo"><option value="daño">Daño</option><option value="objeto_olvidado">Objeto olvidado</option>
        <option value="incidente">Incidente</option><option value="otro">Otro</option></select>
      <input id="desc" placeholder="Descripción" size="40">
      <button onclick="novedad()">Guardar novedad</button>
    </section>
    <section><h3>Celdas</h3><div class="celdas" id="celdas"></div></section>
    <section><h3>Vehículos dentro del parqueadero</h3>
      <table><thead><tr><th>Placa</th><th>Celda</th><th>Cliente</th><th>Entrada</th></tr></thead><tbody id="activos"></tbody></table>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
function aviso(t, ok){const m=$('msg');m.textContent=t;m.className=ok?'ok':'err';m.style.display='block';}
async function api(url, body){
  const r = await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d = await r.json(); if(!r.ok) throw new Error(d.error||'Error'); return d;
}
async function login(){
  try{await api('/api/login',{usuario:$('usuario').value,password:$('password').value});
    $('login').style.display='none';$('panel').style.display='grid';refrescar();aviso('Sesión iniciada',true);}
  catch(e){aviso(e.message,false);}
}
async function mover(tipo){
  try{const d=await api('/api/'+tipo,{placa:$('placa').value});
    aviso(tipo==='entradas'?`Entrada registrada: ${d.placa} en celda ${d.celda}`:`Salida registrada: ${d.placa}`,true);
    $('placa').value='';refrescar();}
  catch(e){aviso(e.message,false);}
}
async function novedad(){
  try{await api('/api/novedades',{placa:$('placa').value,tipo:$('tipo').value,descripcion:$('desc').value});
    aviso('Novedad registrada',true);$('desc').value='';}
  catch(e){aviso(e.message,false);}
}
async function refrescar(){
  const [c,a]=await Promise.all([api('/api/celdas'),api('/api/movimientos/activos')]);
  $('celdas').innerHTML=c.map(x=>`<div class="celda ${x.estado}">${x.codigo}</div>`).join('');
  $('activos').innerHTML=a.map(x=>`<tr><td>${x.placa}</td><td>${x.celda}</td><td>${x.cliente}</td><td>${x.fecha_entrada.replace('T',' ')}</td></tr>`).join('')||'<tr><td colspan=4>Sin vehículos</td></tr>';
}
</script>
</body>
</html>
